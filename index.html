<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Form</title>
    <style type="text/css">

        body {
            background-color: lightblue;
            color: navy;
            margin: auto;
        }

        .hero-image{
            background-image: url(https://upload.wikimedia.org/wikipedia/commons/9/91/Pizza-3007395.jpg?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=original);
        }

        .hero-text {
            padding: 20px;
        }
    </style>

</head>
<body>
    <!-- HERO SECTION -->
    <div class="hero-image">
        <div class="hero-text">
           <h1>9-Ruby Bistro | Pizza-on-Demand</h1> 
        </div>
    </div>

    <!-- MAIN FORM -->
    <div class="main">
        <p>Our 12" wood-fire pizza...</p>

        <form>
            <!-- CUSTOMER INFO -->
            <fieldset>
                <legend>Your Information</legend>
                <label for="fullname">Name:</label>
                <input type="text" name="fullname" placeholder="Enter your full name here">
                <br>
                <label for="addr">Address:</label>
                <input type="text" name="addr">
                <br>
                <label for="tel-num">Contact Num:</label>
                <input type="tel" name="tel-num">
                <br>
                <label for="email-addr">Email:</label>
                <input type="email" name="email-addr">
                <br>
                <label for="del-reqt">Delivery Instructions:</label><br>
                <textarea placeholder="Enter your delivery request here."></textarea>
            </fieldset>

            <!-- PIZZA SPECS -->
            <h3>Design your Dream Pizza</h3>
            <fieldset>
                <legend>Pizza Specification</legend>

                <!-- CRUST -->
                <fieldset>
                    <legend>Crust <em>(Choose one)</em></legend>
                    <input type="radio" name="crust">
                    <label>Classic White</label>
                    <br>
                    <input type="radio" name="crust">
                    <label>Multigrain</label>
                    <br>
                </fieldset>

                <!-- TOPPINGS -->
                <fieldset>
                    <legend>Toppings <em>(Choose as many as you want)</em></legend>
                    <input type="checkbox" name="toppings">
                    <label>Red Sauce</label>
                    <br>
                    <input type="checkbox" name="toppings">
                    <label>White Sauce</label>
                    <br>
                </fieldset>

                <!-- NUMBER -->
                <fieldset>
                    <legend>Quantity<em>(How many pizza)</em></legend>
                    <label>How many pizza: </label>
                    <select>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5"></option>
                    </select>
                </fieldset>

            </fieldset>

            <input type="submit" value="Bring me a pizza">
            <input type="reset" value="Let me reorder">
        </form>
    </div>

    .footer
    
</body>
</html>
